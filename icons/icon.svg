<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#0e172a" />
      <stop offset="60%" stop-color="#05070d" />
      <stop offset="100%" stop-color="#020306" />
    </radialGradient>

    <!-- Neon Glow Filter -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glowMagenta" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glowYellow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base App Icon Tile -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer Neon Arcade Border -->
  <rect x="24" y="24" width="464" height="464" rx="96" fill="none" stroke="#00f0ff" stroke-width="4" opacity="0.4" filter="url(#glowCyan)" />

  <!-- Grid lines subtle pattern -->
  <g stroke="#00f0ff" stroke-width="1" opacity="0.08">
    <line x1="64" y1="128" x2="448" y2="128" />
    <line x1="64" y1="192" x2="448" y2="192" />
    <line x1="64" y1="256" x2="448" y2="256" />
    <line x1="64" y1="320" x2="448" y2="320" />
    <line x1="64" y1="384" x2="448" y2="384" />
    <line x1="128" y1="64" x2="128" y2="448" />
    <line x1="192" y1="64" x2="192" y2="448" />
    <line x1="256" y1="64" x2="256" y2="448" />
    <line x1="320" y1="64" x2="320" y2="448" />
    <line x1="384" y1="64" x2="384" y2="448" />
  </g>

  <!-- Qix Vector Ribbon Trails -->
  <g fill="none" stroke-linecap="round">
    <line x1="120" y1="320" x2="360" y2="160" stroke="#0044ff" stroke-width="2.5" opacity="0.3" />
    <line x1="130" y1="305" x2="368" y2="155" stroke="#0088ff" stroke-width="2.5" opacity="0.4" />
    <line x1="145" y1="290" x2="375" y2="155" stroke="#00e5ff" stroke-width="3" opacity="0.6" filter="url(#glowCyan)" />
    <line x1="165" y1="278" x2="380" y2="160" stroke="#ff00aa" stroke-width="3" opacity="0.7" filter="url(#glowMagenta)" />
    <line x1="190" y1="268" x2="382" y2="170" stroke="#ff0055" stroke-width="3" opacity="0.8" />
    <line x1="218" y1="262" x2="380" y2="185" stroke="#ff5500" stroke-width="3.5" opacity="0.9" />
    <line x1="250" y1="260" x2="370" y2="205" stroke="#ffea00" stroke-width="4" filter="url(#glowYellow)" />
    <!-- Leading white lightning spark -->
    <line x1="250" y1="260" x2="370" y2="205" stroke="#ffffff" stroke-width="2" />
  </g>

  <!-- Captured Polygon Area with Neon Shading -->
  <polygon points="64,448 64,360 210,360 210,448" fill="rgba(0, 140, 255, 0.25)" stroke="#00f0ff" stroke-width="3" filter="url(#glowCyan)" />

  <!-- Player Diamond Marker -->
  <g transform="translate(210, 360)">
    <polygon points="0,-16 16,0 0,16 -16,0" fill="#00ff88" stroke="#ffffff" stroke-width="2.5" filter="url(#glowCyan)" />
    <circle cx="0" cy="0" r="4" fill="#ffffff" />
  </g>

  <!-- Sparx Enemy on border -->
  <g transform="translate(64, 200)">
    <line x1="-12" y1="0" x2="12" y2="0" stroke="#ffff00" stroke-width="3" filter="url(#glowYellow)" />
    <line x1="0" y1="-12" x2="0" y2="12" stroke="#ffff00" stroke-width="3" filter="url(#glowYellow)" />
    <circle cx="0" cy="0" r="4" fill="#ff0055" />
  </g>

  <!-- Typographic Retro "QIX" Header -->
  <text x="256" y="112" font-family="'Press Start 2P', monospace, sans-serif" font-weight="900" font-size="54" fill="#00f0ff" text-anchor="middle" filter="url(#glowCyan)" letter-spacing="4">QIX</text>
  <text x="256" y="112" font-family="'Press Start 2P', monospace, sans-serif" font-weight="900" font-size="54" fill="#ffffff" text-anchor="middle" letter-spacing="4">QIX</text>

  <!-- "1981 ARCADE" Subtitle Badge -->
  <rect x="180" y="420" width="152" height="30" rx="6" fill="rgba(255, 0, 119, 0.2)" stroke="#ff0077" stroke-width="1.5" />
  <text x="256" y="440" font-family="'Press Start 2P', monospace, sans-serif" font-size="11" fill="#ff0077" text-anchor="middle" letter-spacing="1">1981 ARCADE</text>
</svg>
